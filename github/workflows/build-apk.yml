# Builds the Calendar for Moana Android app on GitHub's computers,
# so no laptop build and no USB cable are needed.
# Runs on every push to main, or manually from the Actions tab.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build the APK
        run: flutter build apk --debug

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: calendar-for-moana-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
